sonar.projectKey=notes-api
sonar.projectName=notes-api
sonar.sourceEncoding=UTF-8

# Application code and tests
sonar.sources=app.js,server.js,public
sonar.tests=tests
sonar.test.inclusions=tests/**

# Keep generated and third-party files out of the analysis
sonar.exclusions=node_modules/**,coverage/**

# Coverage report produced by "npm test" (Jest with --coverage)
sonar.javascript.lcov.reportPaths=coverage/lcov.info